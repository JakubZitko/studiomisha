<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Přesměrování | Studio Mísha</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://studiomisha.cz/">
  <meta http-equiv="refresh" content="0; url=https://studiomisha.cz/">
  <script>window.location.replace('https://studiomisha.cz/' + window.location.search + window.location.hash);</script>
</head>
<body>
  <p>Stránka byla přesunuta na <a href="https://studiomisha.cz/">hlavní stránku Studia Mísha</a>.</p>
<script data-goatcounter="https://studiomisha.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href^="tel:"]');
if(!a||!window.goatcounter||!goatcounter.count)return;
goatcounter.count({event:true,path:'call-click:'+location.pathname,title:'Call click'});},true);
</script>
</body>
</html>
